<style>
  /* 自带配色变量，作用域限定在 .navbar，避免影响页面其他元素 */
  .navbar {
    --nav-surface: rgba(255, 255, 255, 0.95);
    --nav-text: #0f172a;
    --nav-muted: #475569;
    --nav-accent: #16a34a;
    --nav-border: #cbd5e1;
    position: sticky;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 999;
    background: var(--nav-surface);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--nav-border);
    padding: 0.8rem 1.5rem;
    color: var(--nav-text);
  }
  html[data-theme="dark"] .navbar {
    --nav-surface: rgba(8, 16, 25, 0.92);
    --nav-text: #f6f7f3;
    --nav-muted: #cbd5e1;
    --nav-accent: #6b8e23;
    --nav-border: #294228;
  }
  .navbar *,
  .navbar *::before,
  .navbar *::after { box-sizing: border-box; }

  .navbar .navbar-content {
    display: flex;
    flex-wrap: nowrap; /* 始终保持一行 */
    justify-content: flex-start;
    align-items: center;
    gap: 1.15rem;
    max-width: none; /* 满宽铺开，不再居中留白 */
    margin: 0;
    width: 100%;
  }

  .navbar .brand {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    text-decoration: none;
  }
  .navbar .brand img {
    width: 48px;
    height: 48px;
    background: #fff;
    padding: 2px;
    border-radius: 50%;
    object-fit: contain;
  }
  .navbar .brand .brand-text {
    color: var(--nav-text);
    font-size: 1.45rem;
    font-weight: 800;
    line-height: 1;
    white-space: nowrap;
    letter-spacing: 0.04em;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  }

  .navbar .left-nav {
    display: flex;
    align-items: center;
    gap: 1.3rem;
    flex-shrink: 0;
    min-width: 0;
  }
  .navbar .nav-link {
    color: var(--nav-text);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0.25rem 0;
    transition: color 0.2s ease;
  }
  .navbar .nav-link:hover { color: var(--nav-accent); }

  .navbar .nav-buttons {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    flex-shrink: 0;
    margin-left: auto;
    padding-left: 1.15rem;
    border-left: 1px solid var(--nav-border);
  }

  /* 搜索 */
  .navbar .search-container { position: relative; display: flex; align-items: center; }
  .navbar .search-input {
    width: 150px;
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--nav-border);
    background: transparent;
    color: var(--nav-text);
    font-size: 0.85rem;
    outline: none;
  }
  .navbar .search-input::placeholder { color: var(--nav-muted); }
  .navbar .search-input:focus { border-color: var(--nav-accent); }
  .navbar .search-button {
    margin-left: 4px;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: none;
    background: var(--nav-accent);
    color: #fff;
    cursor: pointer;
  }

  /* 服务下拉 */
  .navbar .services-toggle-container { position: relative; }
  .navbar .services-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 235px;
    background: var(--nav-surface);
    border: 1px solid var(--nav-border);
    border-radius: 10px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.18);
    padding: 0.4rem;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    z-index: 1001;
  }
  .navbar .services-toggle-container.active .services-dropdown {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

    .navbar .services-toggle-container:hover .services-dropdown {

      transform: translateY(0);

    color: var(--nav-text);

    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 145px;
    background: var(--nav-surface);
    border: 1px solid var(--nav-border);
    border-radius: 10px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.18);
    padding: 0.35rem;

    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;

  .navbar .lang-container.active .lang-dropdown {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .navbar .lang-option {
    padding: 0.45rem 0.6rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--nav-text);
  }
  .navbar .lang-option:hover { background: rgba(34, 197, 94, 0.12); color: var(--nav-accent); }

  /* 主题开关 */
  .navbar .theme-toggle {
    width: 56px;
    height: 28px;
    border-radius: 999px;
    border: 2px solid #f59e0b;
    background: #fef3c7;
    position: relative;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .navbar .theme-toggle-track {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 100%;
    padding: 0 6px;
  }
  .navbar .theme-toggle-icon { font-size: 11px; line-height: 1; color: #b45309; }
  .navbar .theme-toggle-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    transition: left 0.2s ease;
  }
  html[data-theme="dark"] .navbar .theme-toggle { background: #1e293b; border-color: #475569; }
  html[data-theme="dark"] .navbar .theme-toggle-icon { color: #cbd5e1; }
  html[data-theme="dark"] .navbar .theme-toggle-thumb { left: calc(100% - 22px); background: #e2e8f0; }

  /* 按钮 */
  .navbar .btn {
    padding: 0.52rem 0.9rem;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.85rem;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    white-space: nowrap;
  }
  .navbar .btn-secondary {
    background: transparent;
    border: 1px solid var(--nav-border);
    color: var(--nav-text);
  }
  .navbar .btn-secondary:hover { border-color: var(--nav-accent); background: rgba(34, 197, 94, 0.1); }
  .navbar .btn-primary { background: var(--nav-accent); color: #fff; }

  /* ===== 始终一行：窄屏只收间距与尺寸，绝不换行 ===== */
  @media (max-width: 1500px) {
    .navbar { padding: 0.75rem 1.1rem; }

    .navbar .nav-link { font-size: 0.85rem; }
    .navbar .search-input { width: 110px; }
    .navbar .nav-buttons { gap: 0.4rem; padding-left: 0.9rem; }
    .navbar .btn { padding: 0.46rem 0.75rem; font-size: 0.82rem; }
    .navbar .lang-trigger { padding: 0.46rem 0.65rem; font-size: 0.82rem; }
  }
</style>
