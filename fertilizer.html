<!doctype html>
<html lang="zh-CN" data-lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="基于土壤 pH、作物与生育期的科学施肥建议。规则库结果仅作参考，需结合测土配方。" />
  <title>科学施肥建议｜农智云</title>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="cn-i18n.css" />
  <style>
    :root {
      --bg: #07130d;
      --bg-soft: #0d1f16;
      --card: rgba(14, 37, 25, 0.86);
      --line: rgba(134, 239, 172, 0.18);
      --text: #f0fdf4;
      --muted: #a7c5b1;
      --green: #4ade80;
      --green-deep: #16a34a;
      --amber: #fbbf24;
    }
    [data-theme="light"] {
      --bg: #f4fbf6;
      --bg-soft: #ffffff;
      --card: rgba(255, 255, 255, 0.94);
      --line: #d7e8dc;
      --text: #12251a;
      --muted: #52695b;
      --green: #15803d;
      --green-deep: #166534;
      --amber: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 80% 0%, rgba(34, 197, 94, 0.15), transparent 34%),
        radial-gradient(circle at 10% 60%, rgba(74, 222, 128, 0.06), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    .page { max-width: 1180px; margin: 0 auto; padding: 22px 24px 70px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 12px 0 26px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
    .brand img { width: 42px; height: 42px; border-radius: 11px; background: #fff; padding: 4px; }
    .back {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px;
      border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 14px;
    }
    .back:hover { color: var(--green); border-color: var(--green); }
    .hero { padding: 36px 0 28px; max-width: 780px; }
    .kicker {
      display: inline-flex; align-items: center; gap: 8px; color: var(--green);
      font-size: 13px; letter-spacing: 0.08em; border: 1px solid rgba(74,222,128,.28);
      background: rgba(34,197,94,.08); border-radius: 999px; padding: 7px 12px;
    }
    h1 {
      margin: 18px 0 14px; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.12;
      letter-spacing: -0.02em;
    }
    .hero p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.8; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); gap: 22px; align-items: start; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 20px;
      padding: 26px; box-shadow: 0 24px 70px rgba(0,0,0,.18); backdrop-filter: blur(12px);
    }
    .card h2 { margin: 0 0 6px; font-size: 20px; }
    .card-sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field.full { grid-column: 1 / -1; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 7px; }
    input, select {
      width: 100%; min-height: 46px; border-radius: 11px; border: 1px solid var(--line);
      background: var(--bg-soft); color: var(--text); padding: 10px 12px; font: inherit;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(74, 222, 128, .12); }
    .hint { margin-top: 6px; color: var(--muted); font-size: 11px; }
    .submit {
      width: 100%; margin-top: 20px; min-height: 50px; border: 0; border-radius: 12px;
      background: linear-gradient(135deg, var(--green), var(--green-deep)); color: #04140b;
      font: inherit; font-weight: 800; font-size: 16px; cursor: pointer;
    }
    .submit:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .submit:disabled { opacity: .55; cursor: wait; transform: none; }
    .result { min-height: 360px; }
    .empty { display: grid; place-items: center; text-align: center; min-height: 310px; color: var(--muted); }
    .empty i { font-size: 44px; color: var(--green); margin-bottom: 14px; opacity: .8; }
    .result-main { padding: 18px 0 14px; border-bottom: 1px solid var(--line); }
    .result-main small { color: var(--muted); }
    .result-main strong { display: block; margin: 7px 0 10px; font-size: 28px; color: var(--green); }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
    .metric { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: rgba(34,197,94,.04); }
    .metric span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 5px; }
    .metric strong { font-size: 15px; }
    .notes { margin: 0; padding-left: 19px; color: var(--muted); font-size: 13px; line-height: 1.75; }
    .notice { margin-top: 16px; padding: 11px 13px; border-left: 3px solid var(--amber); background: rgba(251,191,36,.08); border-radius: 6px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .basis { margin-top: 12px; font-size: 11px; color: var(--muted); }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .hero { padding-top: 20px; }
    }
    @media (max-width: 540px) {
      .page { padding: 14px 14px 60px; }
      .grid { grid-template-columns: 1fr; }
      .card { padding: 20px; border-radius: 16px; }
      .brand span { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a href="index.html" class="brand">
        <img src="images/logo.png" alt="农智云标志" />
        <span>农智云</span>
      </a>
      <a class="back" href="index.html"><i class="fas fa-arrow-left"></i> 返回首页</a>
    </header>

    <section class="hero">
      <span class="kicker"><i class="fas fa-flask"></i> 规则库农艺工具</span>
      <h1>科学施肥建议</h1>
      <p>根据作物类型、土壤 pH、生育期与近期降雨给出一般性施肥方向。建议先测土配方，再结合目标产量与当地肥料登记信息确定用量。</p>
    </section>

    <div class="layout">
      <section class="card">
        <h2>输入地块信息</h2>
        <p class="card-sub">以下数据仅在本机提交给本地 Flask 服务，不发送到第三方模型。</p>
        <form id="fertilizerForm">
          <div class="grid">
            <div class="field">
              <label for="crop">作物</label>
              <select id="crop" name="crop_type">
                <option value="rice">水稻</option>
                <option value="wheat">小麦</option>
                <option value="maize">玉米</option>
                <option value="cotton">棉花</option>
                <option value="soybean">大豆</option>
                <option value="tomato">番茄</option>
                <option value="potato">马铃薯</option>
                <option value="onion">洋葱</option>
                <option value="groundnut">花生</option>
                <option value="sugarcane">甘蔗</option>
              </select>
            </div>
            <div class="field">
              <label for="soilPh">土壤 pH</label>
              <input id="soilPh" name="soil_ph" type="number" min="3.5" max="10" step="0.1" value="6.5" required />
              <div class="hint">常见范围 3.5–10.0</div>
            </div>
            <div class="field">
              <label for="growthStage">生育期</label>
              <select id="growthStage" name="growth_stage">
                <option value="seedling">苗期</option>
                <option value="vegetative" selected>营养生长期</option>
                <option value="flowering">开花期</option>
                <option value="fruiting">结果期</option>
              </select>
            </div>
            <div class="field">
              <label for="rainfall">近7天降雨量（毫米）</label>
              <input id="rainfall" name="rainfall" type="number" min="0" max="1000" step="1" placeholder="可选" />
            </div>
            <div class="field full">
              <label for="temperature">近期平均气温（℃）</label>
              <input id="temperature" name="temperature" type="number" min="-20" max="55" step="0.1" placeholder="可选，例如 24.5" />
            </div>
          </div>
          <button class="submit" id="submitBtn" type="submit"><i class="fas fa-seedling"></i> 获取施肥建议</button>
        </form>
      </section>

      <aside class="card result" id="resultCard" aria-live="polite">
        <div class="empty" id="emptyState">
          <div>
            <i class="fas fa-wheat-awn"></i>
            <div>填写左侧信息后查看建议</div>
            <div style="font-size:12px;margin-top:8px;">结果为一般性规则建议，不是处方</div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const form = document.getElementById('fertilizerForm');
    const resultCard = document.getElementById('resultCard');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        crop_type: document.getElementById('crop').value,
        soil_ph: document.getElementById('soilPh').value,
        growth_stage: document.getElementById('growthStage').value,
        rainfall: document.getElementById('rainfall').value,
        temperature: document.getElementById('temperature').value,
      };
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在计算建议…';
      try {
        const response = await fetch('/api/fertilizer/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok || data.status !== 'success') throw new Error(data.message || '服务暂不可用');
        render(data.recommendation, data.notice);
      } catch (error) {
        resultCard.innerHTML = `<div class="empty"><div><i class="fas fa-triangle-exclamation" style="color:#fbbf24"></i><div>暂时无法生成建议</div><div style="font-size:12px;margin-top:8px;">${error.message}</div></div></div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-seedling"></i> 获取施肥建议';
      }
    });

    function render(rec, notice) {
      const low = rec.rate_kg_per_mu[0];
      const high = rec.rate_kg_per_mu[1];
      resultCard.innerHTML = `
        <h2>推荐方向</h2>
        <p class="card-sub">基于规则库与输入条件生成，需结合测土配方复核。</p>
        <div class="result-main">
          <small>建议肥料类型</small>
          <strong>${rec.fertilizer_name || '平衡型复合肥'}</strong>
          <span style="color:var(--muted);font-size:13px;">NPK 参考比例：${rec.npk_ratio || '按测土配方确定'}</span>
        </div>
        <div class="metrics">
          <div class="metric"><span>建议用量范围</span><strong>${low}–${high} 公斤/亩</strong></div>
          <div class="metric"><span>生育期</span><strong>${document.getElementById('growthStage').selectedOptions[0].text}</strong></div>
          <div class="metric"><span>土壤 pH</span><strong>${rec.soil_ph}</strong></div>
          <div class="metric"><span>参考置信度</span><strong>${Math.round((rec.confidence || 0) * 100)}%</strong></div>
        </div>
        <h3 style="font-size:14px;margin:16px 0 8px;">管理提示</h3>
        <ul class="notes">${(rec.notes || []).map((note) => `<li>${note}</li>`).join('') || '<li>请结合测土结果确定具体配方。</li>'}</ul>
        <div class="notice">${notice || ''}</div>
        <div class="basis">推荐依据：${rec.basis || '作物养分需求与土壤 pH 规则。'}</div>
      `;
    }
  </script>
    <script src="translations.js" defer></script>
  <script src="scripts/locales/zh-CN-extra.js" defer></script>
<script src="scripts/i18n.js" defer></script>
</body>
</html>
